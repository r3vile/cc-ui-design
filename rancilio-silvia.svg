           C80,229 73,231 73,232.5
           C73,234 80,235.5 92,235.5
           C112,235.5 138,234 155,233
           Z"/>
  <!-- Rancilio "R" logo circle on handle end -->
  <circle cx="66" cy="230" r="14"/>
  <circle cx="66" cy="230" r="10" fill="#ffffff"/>
  <!-- Stylized R letter -->
  <path d="M62,224 h5 c3.5,0 5.5,2 5.5,4.5 c0,2 -1.5,3.5 -3.5,4 l4,4.5 h-3.5 l-3.5,-4.2 h-1 v4.2 h-3 Z
           M65,226.5 v3.5 h2 c1.5,0 2.5,-0.8 2.5,-1.8 c0,-1 -1,-1.7 -2.5,-1.7 Z"/>

  <!-- STEAM WAND -->
  <!-- Connection bracket on machine body -->
  <path d="M352,190 h14 v16 h-14 Z
           M355,193 v10 h8 v-10 Z"/>
  <!-- Wand pivot joint -->
  <circle cx="372" cy="212" r="7"/>
  <circle cx="372" cy="212" r="4" fill="#ffffff"/>
  <circle cx="372" cy="212" r="3"/>
  <!-- Rubber boot/sleeve -->
  <path d="M365,219 h14 l-2,24 h-10 Z"/>
  <!-- Chrome wand tube -->
  <rect x="369" y="243" width="4" height="160"/>
  <!-- Wand tip (slightly wider) -->
  <path d="M367,403 h8 v14 h-8 Z
           M369,406 v8 h4 v-8 Z"/>

  <!-- ESPRESSO CUP - classic demitasse, positioned above drip tray -->
  <!-- Cup body - slightly tapered, wider top -->
  <path d="M188,405 h64 l-4,48 h-56 Z
           M195,411 v36 h50 v-36 Z"/>
  <!-- Cup handle (right side, small D-shape) -->
  <path d="M252,414
           c10,0 15,8 15,16
           c0,8 -5,15 -15,15
           v-6
           c6,0 9,-4 9,-9
           c0,-5 -3,-10 -9,-10 Z"/>

  <!-- DRIP TRAY -->
  <!-- Tray lip/rim -->
  <rect x="72" y="458" width="298" height="5"/>
  <!-- Tray body (outer CW, inner CCW) -->
  <path d="M75,463 h290 v46 h-290 Z
           M83,469 v34 h274 v-34 Z"/>

  <!-- Drip tray perforated grid (right portion, 4 rows) -->
  <!-- Row 1 -->
  <circle cx="250" cy="475" r="2.2"/>
  <circle cx="261" cy="475" r="2.2"/>
  <circle cx="272" cy="475" r="2.2"/>
  <circle cx="283" cy="475" r="2.2"/>
  <circle cx="294" cy="475" r="2.2"/>
  <circle cx="305" cy="475" r="2.2"/>
  <circle cx="316" cy="475" r="2.2"/>
  <circle cx="327" cy="475" r="2.2"/>
  <circle cx="338" cy="475" r="2.2"/>
  <circle cx="349" cy="475" r="2.2"/>
  <!-- Row 2 (offset) -->
  <circle cx="255" cy="483" r="2.2"/>
  <circle cx="266" cy="483" r="2.2"/>
  <circle cx="277" cy="483" r="2.2"/>
  <circle cx="288" cy="483" r="2.2"/>
  <circle cx="299" cy="483" r="2.2"/>
  <circle cx="310" cy="483" r="2.2"/>
  <circle cx="321" cy="483" r="2.2"/>
  <circle cx="332" cy="483" r="2.2"/>
  <circle cx="343" cy="483" r="2.2"/>
  <!-- Row 3 -->
  <circle cx="250" cy="491" r="2.2"/>
  <circle cx="261" cy="491" r="2.2"/>
  <circle cx="272" cy="491" r="2.2"/>
  <circle cx="283" cy="491" r="2.2"/>
  <circle cx="294" cy="491" r="2.2"/>
  <circle cx="305" cy="491" r="2.2"/>
  <circle cx="316" cy="491" r="2.2"/>
  <circle cx="327" cy="491" r="2.2"/>
  <circle cx="338" cy="491" r="2.2"/>
  <circle cx="349" cy="491" r="2.2"/>
  <!-- Row 4 (offset) -->
  <circle cx="255" cy="499" r="2.2"/>
  <circle cx="266" cy="499" r="2.2"/>
  <circle cx="277" cy="499" r="2.2"/>
  <circle cx="288" cy="499" r="2.2"/>
  <circle cx="299" cy="499" r="2.2"/>
  <circle cx="310" cy="499" r="2.2"/>
  <circle cx="321" cy="499" r="2.2"/>
  <circle cx="332" cy="499" r="2.2"/>
  <circle cx="343" cy="499" r="2.2"/>

  <!-- MACHINE BASE -->
  <rect x="68" y="515" width="304" height="12" rx="3"/>

  <!-- Mounting screws on right panel -->
  <circle cx="348" cy="190" r="3.5"/>
  <circle cx="348" cy="190" r="1.5" fill="#ffffff"/>
  <circle cx="348" cy="438" r="3.5"/>
  <circle cx="348" cy="438" r="1.5" fill="#ffffff"/>
</g>
