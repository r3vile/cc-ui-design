<?xml version="1.0" encoding="UTF-8"?>
<svg fill="#000000" height="800px" width="800px" version="1.1"
     xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 500 660">
<g>
  <!-- MAIN BODY - outer rectangle CW, inner CCW for cutout -->
  <path d="M80,15 h280 v530 h-280 Z
           M88,23 v514 h264 v-514 Z"/>

  <!-- Machine top edge detail -->
  <rect x="80" y="15" width="280" height="4"/>

  <!-- Upper panel horizontal divider -->
