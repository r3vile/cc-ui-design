  <!-- POWER SWITCH -->
  <!-- Switch housing (outer CW, inner CCW) -->
  <path d="M104,44 h36 v40 h-36 Z
           M110,50 v28 h24 v-28 Z"/>
  <!-- Switch rocker - ON position (top half) -->
  <rect x="113" y="53" width="18" height="12" rx="1"/>
  <!-- Power icon on switch face -->
  <circle cx="122" cy="58" r="3" fill="none" stroke="#ffffff" stroke-width="1"/>
  <line x1="122" y1="54.5" x2="122" y2="57" stroke="#ffffff" stroke-width="1"/>
  <!-- Power indicator light -->
  <circle cx="122" cy="72" r="3.5"/>
  <circle cx="122" cy="72" r="1.5" fill="#ffffff"/>

  <!-- STEAM/HOT WATER SWITCH -->
  <!-- Switch housing -->
  <path d="M104,96 h36 v40 h-36 Z
           M110,102 v28 h24 v-28 Z"/>
  <!-- Switch rocker - OFF position (bottom half) -->
  <rect x="113" y="118" width="18" height="9" rx="1"/>
  <!-- Steam icon (wavy lines) -->
  <path d="M117,107 q2.5,-3.5 5,0 q2.5,3.5 5,0" fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M117,112 q2.5,-3.5 5,0 q2.5,3.5 5,0" fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round"/>

  <!-- STEAM KNOB (upper right) - concentric circles -->
  <!-- Outer bezel -->
  <circle cx="308" cy="92" r="35"/>
  <circle cx="308" cy="92" r="28" fill="#ffffff"/>
  <!-- Inner raised ring -->
  <circle cx="308" cy="92" r="26"/>
  <circle cx="308" cy="92" r="19" fill="#ffffff"/>
  <!-- Rancilio crown/lotus logo (simplified) -->
  <path d="M300,88 l2.5,-7 3,6 2.5,-8 2.5,6 3,-7 2.5,7 -1,4 h-14 z"/>
  <!-- Dot below logo -->
  <circle cx="308" cy="99" r="1.8"/>

  <!-- GROUP HEAD - black dome/housing -->
  <path d="M168,167 h104 v12
           c0,30 -18,52 -52,52
           c-34,0 -52,-22 -52,-52 Z"/>

  <!-- PORTAFILTER ASSEMBLY -->
  <!-- Filter basket / collar -->
  <path d="M190,231 h60 l-4,16 h-52 Z
           M197,235 v7 h46 v-7 Z"/>

  <!-- Portafilter spouts (double spout) -->
  <path d="M207,247 h8 v14 l-2,5 h-4 l-2,-5 Z"/>
  <path d="M226,247 h8 v14 l-2,5 h-4 l-2,-5 Z"/>

  <!-- PORTAFILTER HANDLE - thick ergonomic shape -->
  <!-- Main handle body - uniform thickness extending left -->
  <path d="M190,222
           C170,220 130,216 95,216
           C72,216 58,222 58,230
           C58,238 72,244 95,244
           C130,244 170,242 190,242
           Z"/>
  <!-- Handle 3D highlight (white band through middle) -->
  <path d="M160,232
           C140,230 110,228 88,228
           C74,228 66,230 66,232
           C66,234 74,237 88,237
           C110,237 140,235 160,234
