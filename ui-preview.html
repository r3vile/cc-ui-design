<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espresso Machine UI — 480×480 Round Display</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

  /* ── Reset & Page ── */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0a0a0a;
    color: #e0e0e0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 40px 20px;
  }

  h1 {
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #666;
    margin-bottom: 8px;
  }
  .subtitle {
    font-size: 12px;
    color: #444;
    margin-bottom: 40px;
    letter-spacing: 1px;
  }

  /* ── Screen selector tabs ── */
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 32px;
    background: #141414;
    border-radius: 12px;
    padding: 4px;
  }
  .tab {
    padding: 10px 20px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.5px;
    color: #666;
    border: none;
    background: transparent;
    cursor: pointer;
    border-radius: 8px;
    transition: all 0.3s ease;
    font-family: inherit;
  }
  .tab:hover { color: #999; }
  .tab.active {
    background: #1e1e1e;
    color: #d4a054;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }

  /* ── Round display frame ── */
  .display-frame {
    position: relative;
    width: 520px;
    height: 520px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .display-bezel {
    position: absolute;
    width: 510px;
    height: 510px;
    border-radius: 50%;
    background: linear-gradient(145deg, #2a2a2a, #111);
    box-shadow:
      0 0 0 2px #222,
      0 20px 60px rgba(0,0,0,0.8),
      inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .display {
    position: relative;
    width: 480px;
    height: 480px;
    border-radius: 50%;
    overflow: hidden;
    background: #0d0d0d;
    z-index: 1;
  }

  /* ── Screen container ── */
  .screen {
    display: none;
    position: absolute;
    inset: 0;
    width: 480px;
    height: 480px;
  }
  .screen.active { display: flex; }

  /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
     MAIN SCREEN
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
  .main-screen {
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: radial-gradient(circle at 50% 50%, #151515 0%, #0a0a0a 70%);
  }

  .main-logo {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #d4a054;
    opacity: 0.7;
    margin-bottom: 0;
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
  }

  .main-icons {
    position: relative;
    width: 480px;
    height: 480px;
  }

  .main-icon-btn {
    position: absolute;
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
  }
  .main-icon-btn:hover {
    background: rgba(212,160,84,0.1);
    border-color: rgba(212,160,84,0.3);
    transform: scale(1.08);
  }
  .main-icon-btn:hover svg { color: #d4a054; }
  .main-icon-btn svg {
    width: 28px;
    height: 28px;
    color: rgba(255,255,255,0.55);
    transition: color 0.3s ease;
  }

  /* Position icons in a circle (radius ~148px from center 240,240) */
  .main-icon-btn:nth-child(1) { left: 204px; top: 56px; }   /* Coffee — top */
  .main-icon-btn:nth-child(2) { left: 352px; top: 204px; }   /* Steam — right */
  .main-icon-btn:nth-child(3) { left: 204px; top: 352px; }   /* Water — bottom */
  .main-icon-btn:nth-child(4) { left: 56px;  top: 204px; }   /* Settings — left */

  /* Subtle ring decoration */
  .main-ring {
    position: absolute;
    width: 320px;
    height: 320px;
    top: 80px; left: 80px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.03);
    pointer-events: none;
  }

  /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
     COFFEE SCREEN
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
  .coffee-screen {
    flex-direction: column;
    align-items: center;
    background: radial-gradient(circle at 50% 40%, #151515 0%, #0a0a0a 70%);
  }

  .coffee-back {
    position: absolute;
    top: 48px;
    left: 50%;
    transform: translateX(-50%);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s ease;
    z-index: 10;
  }
  .coffee-back:hover {
    background: rgba(255,255,255,0.08);
  }
  .coffee-back svg {
    width: 18px;
    height: 18px;
    color: rgba(255,255,255,0.5);
  }

  .coffee-carousel {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -55%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  .coffee-icon-display {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: rgba(212,160,84,0.06);
    border: 1px solid rgba(212,160,84,0.12);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .coffee-icon-display svg {
    width: 44px;
    height: 44px;
    color: #d4a054;
  }

  .coffee-name {
    font-size: 18px;
    font-weight: 300;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.85);
  }

  .coffee-dots {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }
  .coffee-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    transition: all 0.3s;
  }
  .coffee-dot.active {
    background: #d4a054;
    width: 18px;
    border-radius: 3px;
  }

  .coffee-swipe-hint {
    font-size: 10px;
    color: rgba(255,255,255,0.2);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 8px;
  }

  .coffee-play {
    position: absolute;
    bottom: 52px;
    left: 50%;
    transform: translateX(-50%);
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, #d4a054, #b8863e);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 20px rgba(212,160,84,0.3);
    z-index: 10;
  }
  .coffee-play:hover {
    transform: translateX(-50%) scale(1.08);
    box-shadow: 0 6px 30px rgba(212,160,84,0.45);
  }
  .coffee-play svg {
    width: 22px;
    height: 22px;
    color: #0a0a0a;
    margin-left: 2px;
  }

  /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
     STEAM SCREEN
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
  .steam-screen {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 50%, #151515 0%, #0a0a0a 70%);
  }

  .steam-back {
    position: absolute;
    top: 48px;
    left: 50%;
    transform: translateX(-50%);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s ease;
    z-index: 10;
  }
  .steam-back:hover { background: rgba(255,255,255,0.08); }
  .steam-back svg { width: 18px; height: 18px; color: rgba(255,255,255,0.5); }

  .steam-progress-ring {
    position: absolute;
    width: 420px;
    height: 420px;
    top: 30px; left: 30px;
  }
  .steam-progress-ring svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }
  .steam-track {
    fill: none;
    stroke: rgba(255,255,255,0.04);
    stroke-width: 6;
  }
  .steam-fill {
    fill: none;
    stroke: url(#steamGradient);
    stroke-width: 6;
    stroke-linecap: round;
    stroke-dasharray: 1194;
    stroke-dashoffset: 340;
    transition: stroke-dashoffset 1s ease;
  }

  .steam-center {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    z-index: 2;
  }

  .steam-temp {
    font-size: 72px;
    font-weight: 200;
    color: #fff;
    line-height: 1;
    letter-spacing: -2px;
  }
  .steam-temp span {
    font-size: 28px;
    font-weight: 300;
    color: rgba(255,255,255,0.4);
    vertical-align: super;
    margin-left: 2px;
  }

  .steam-target {
    font-size: 12px;
    font-weight: 400;
    color: rgba(255,255,255,0.3);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .steam-state {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #e8934a;
    margin-top: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .steam-state-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #e8934a;
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .steam-valve-hint {
    position: absolute;
    bottom: 62px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    color: rgba(255,255,255,0.18);
    letter-spacing: 2px;
    text-transform: uppercase;
    white-space: nowrap;
  }

  /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
     HOT WATER SCREEN
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
  .water-screen {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 50%, #151515 0%, #0a0a0a 70%);
  }

  .water-back {
    position: absolute;
    top: 48px;
    left: 50%;
    transform: translateX(-50%);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s ease;
    z-index: 10;
  }
  .water-back:hover { background: rgba(255,255,255,0.08); }
  .water-back svg { width: 18px; height: 18px; color: rgba(255,255,255,0.5); }

  .water-progress-ring {
    position: absolute;
    width: 420px;
    height: 420px;
    top: 30px; left: 30px;
  }
  .water-progress-ring svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }
  .water-track {
    fill: none;
    stroke: rgba(255,255,255,0.04);
    stroke-width: 6;
  }
  .water-fill {
    fill: none;
    stroke: url(#waterGradient);
    stroke-width: 6;
    stroke-linecap: round;
    stroke-dasharray: 1194;
    stroke-dashoffset: 260;
    transition: stroke-dashoffset 1s ease;
  }

  .water-center {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    z-index: 2;
    margin-top: -20px;
  }

  .water-temp {
    font-size: 72px;
    font-weight: 200;
    color: #fff;
    line-height: 1;
    letter-spacing: -2px;
  }
  .water-temp span {
    font-size: 28px;
    font-weight: 300;
    color: rgba(255,255,255,0.4);
    vertical-align: super;
    margin-left: 2px;
  }

  .water-target {
    font-size: 12px;
    font-weight: 400;
    color: rgba(255,255,255,0.3);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .water-state {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #5ba0d4;
    margin-top: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .water-state-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #5ba0d4;
    animation: pulse 1.5s ease-in-out infinite;
  }

  .water-play {
    position: absolute;
    bottom: 52px;
    left: 50%;
    transform: translateX(-50%);
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, #5ba0d4, #4080b8);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 20px rgba(91,160,212,0.3);
    z-index: 10;
  }
  .water-play:hover {
    transform: translateX(-50%) scale(1.08);
    box-shadow: 0 6px 30px rgba(91,160,212,0.45);
  }
  .water-play svg {
    width: 22px;
    height: 22px;
    color: #0a0a0a;
  }

  /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
     SETTINGS SCREEN
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
  .settings-screen {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 50%, #151515 0%, #0a0a0a 70%);
  }

  .settings-back {
    position: absolute;
    top: 48px;
    left: 50%;
    transform: translateX(-50%);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s ease;
    z-index: 10;
  }
  .settings-back:hover { background: rgba(255,255,255,0.08); }
  .settings-back svg { width: 18px; height: 18px; color: rgba(255,255,255,0.5); }

  .settings-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .settings-placeholder svg {
    width: 48px;
    height: 48px;
    color: rgba(255,255,255,0.12);
  }
  .settings-placeholder-text {
    font-size: 12px;
    color: rgba(255,255,255,0.2);
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  /* ── Info caption below display ── */
  .info {
    margin-top: 32px;
    font-size: 11px;
    color: #444;
    letter-spacing: 1px;
    text-align: center;
  }
</style>
</head>
<body>

<h1>Espresso Machine UI</h1>
<p class="subtitle">480 × 480 Round Display — LVGL Preview</p>

<div class="tabs">
  <button class="tab active" onclick="showScreen('main')">Main</button>
  <button class="tab" onclick="showScreen('coffee')">Coffee</button>
  <button class="tab" onclick="showScreen('steam')">Steam</button>
  <button class="tab" onclick="showScreen('water')">Hot Water</button>
  <button class="tab" onclick="showScreen('settings')">Settings</button>
</div>

<div class="display-frame">
  <div class="display-bezel"></div>
  <div class="display">

    <!-- ════════════ MAIN SCREEN ════════════ -->
    <div class="screen main-screen active" id="screen-main">
      <div class="main-ring"></div>
      <span class="main-logo">espresso</span>
      <div class="main-icons">
        <!-- Coffee (top) -->
        <div class="main-icon-btn" onclick="showScreen('coffee')" title="Coffee">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 8h1a4 4 0 1 1 0 8h-1"/>
            <path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V8z"/>
            <line x1="6" y1="2" x2="6" y2="4"/>
            <line x1="10" y1="2" x2="10" y2="4"/>
            <line x1="14" y1="2" x2="14" y2="4"/>
          </svg>
        </div>
        <!-- Steam (right) -->
        <div class="main-icon-btn" onclick="showScreen('steam')" title="Steam">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
            <path d="M9 6c0-1.5.5-3 2-3s2 1.5 2 3c0 2-3 3-3 5"/>
            <path d="M15 6c0-1.5.5-3 2-3s2 1.5 2 3c0 2-3 3-3 5"/>
            <path d="M3 19h18"/>
            <path d="M5 19v2h14v-2"/>
          </svg>
        </div>
        <!-- Hot Water (bottom) -->
        <div class="main-icon-btn" onclick="showScreen('water')" title="Hot Water">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
          </svg>
        </div>
        <!-- Settings (left) -->
        <div class="main-icon-btn" onclick="showScreen('settings')" title="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- ════════════ COFFEE SCREEN ════════════ -->
    <div class="screen coffee-screen" id="screen-coffee">
      <div class="coffee-back" onclick="showScreen('main')" title="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </div>

      <div class="coffee-carousel">
        <div class="coffee-icon-display">
          <!-- Coffee cup icon changes per type -->
          <svg id="coffee-type-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 8h1a4 4 0 1 1 0 8h-1"/>
            <path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V8z"/>
            <line x1="6" y1="2" x2="6" y2="4"/>
            <line x1="10" y1="2" x2="10" y2="4"/>
            <line x1="14" y1="2" x2="14" y2="4"/>
          </svg>
        </div>
        <div class="coffee-name" id="coffee-type-name">Espresso</div>
        <div class="coffee-dots" id="coffee-dots"></div>
        <div class="coffee-swipe-hint">swipe to change</div>
      </div>

      <button class="coffee-play" title="Brew">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
      </button>
    </div>

    <!-- ════════════ STEAM SCREEN ════════════ -->
    <div class="screen steam-screen" id="screen-steam">
      <div class="steam-back" onclick="showScreen('main')" title="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </div>

      <div class="steam-progress-ring">
        <svg viewBox="0 0 420 420">
          <defs>
            <linearGradient id="steamGradient" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#e8934a"/>
              <stop offset="100%" stop-color="#d4a054"/>
            </linearGradient>
          </defs>
          <circle class="steam-track" cx="210" cy="210" r="190"/>
          <circle class="steam-fill" cx="210" cy="210" r="190"/>
        </svg>
      </div>

      <div class="steam-center">
        <div class="steam-temp" id="steam-temp">89<span>°C</span></div>
        <div class="steam-target">Target 125°C</div>
        <div class="steam-state">
          <div class="steam-state-dot"></div>
          Heating
        </div>
      </div>

      <div class="steam-valve-hint">Open valve when ready</div>
    </div>

    <!-- ════════════ HOT WATER SCREEN ════════════ -->
    <div class="screen water-screen" id="screen-water">
      <div class="water-back" onclick="showScreen('main')" title="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </div>

      <div class="water-progress-ring">
        <svg viewBox="0 0 420 420">
          <defs>
            <linearGradient id="waterGradient" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#5ba0d4"/>
              <stop offset="100%" stop-color="#7bbce8"/>
            </linearGradient>
          </defs>
          <circle class="water-track" cx="210" cy="210" r="190"/>
          <circle class="water-fill" cx="210" cy="210" r="190"/>
        </svg>
      </div>

      <div class="water-center">
        <div class="water-temp" id="water-temp">78<span>°C</span></div>
        <div class="water-target">Target 95°C</div>
        <div class="water-state">
          <div class="water-state-dot"></div>
          Heating
        </div>
      </div>

      <button class="water-play" id="water-play-btn" title="Start" onclick="toggleWater()">
        <svg id="water-play-icon" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
      </button>
    </div>

    <!-- ════════════ SETTINGS SCREEN ════════════ -->
    <div class="screen settings-screen" id="screen-settings">
      <div class="settings-back" onclick="showScreen('main')" title="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </div>

      <div class="settings-placeholder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <div class="settings-placeholder-text">Settings</div>
        <div style="font-size: 10px; color: rgba(255,255,255,0.1); letter-spacing: 1px; margin-top: 4px;">Coming soon</div>
      </div>
    </div>

  </div><!-- /display -->
</div><!-- /display-frame -->

<p class="info">Click icons to navigate &nbsp;·&nbsp; Interactive preview &nbsp;·&nbsp; Tap arrows on coffee screen to cycle types</p>

<script>
  /* ── Screen navigation ── */
  function showScreen(name) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-' + name).classList.add('active');
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => {
      if (t.textContent.toLowerCase().replace('hot ','') === name ||
          (name === 'water' && t.textContent === 'Hot Water') ||
          (name === 'main' && t.textContent === 'Main'))
        t.classList.add('active');
    });
    // Animate steam/water temps when entering those screens
    if (name === 'steam') animateSteamTemp();
    if (name === 'water') animateWaterTemp();
  }

  /* ── Coffee carousel ── */
  const coffeeTypes = [
    { name: 'Espresso', icon: 'espresso' },
    { name: 'Doppio', icon: 'doppio' },
    { name: 'Americano', icon: 'americano' },
    { name: 'Cappuccino', icon: 'cappuccino' },
    { name: 'Flat White', icon: 'flatwhite' },
    { name: 'Latte', icon: 'latte' },
  ];
  let currentCoffee = 0;

  function renderCoffeeDots() {
    const container = document.getElementById('coffee-dots');
    container.innerHTML = '';
    coffeeTypes.forEach((_, i) => {
      const dot = document.createElement('div');
      dot.className = 'coffee-dot' + (i === currentCoffee ? ' active' : '');
      container.appendChild(dot);
    });
  }

  const coffeeIcons = {
    espresso: `<path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V8z"/><line x1="6" y1="2" x2="6" y2="4"/><line x1="10" y1="2" x2="10" y2="4"/>`,
    doppio: `<path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V8z"/><line x1="7" y1="2" x2="7" y2="5"/><line x1="11" y1="2" x2="11" y2="5"/>`,
    americano: `<path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><path d="M6 1v3"/><path d="M10 1v3"/><path d="M14 1v3"/>`,
    cappuccino: `<path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V8z"/><path d="M5 12h10" opacity="0.4"/><path d="M7 2c0 1 1 2 0 3"/><path d="M11 2c0 1 1 2 0 3"/>`,
    flatwhite: `<path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V8z"/><ellipse cx="10" cy="13" rx="4" ry="2" opacity="0.35"/>`,
    latte: `<path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V8z"/><path d="M5 11h10" opacity="0.3"/><path d="M5 14h10" opacity="0.15"/><path d="M8 2c0 1.5 2 2 0 4"/>`,
  };

  function updateCoffeeDisplay() {
    const type = coffeeTypes[currentCoffee];
    document.getElementById('coffee-type-name').textContent = type.name;
    const iconEl = document.getElementById('coffee-type-icon');
    iconEl.innerHTML = coffeeIcons[type.icon] || coffeeIcons.espresso;
    renderCoffeeDots();
  }

  // Swipe detection on coffee screen
  let touchStartX = 0;
  const coffeeScreen = document.getElementById('screen-coffee');
  coffeeScreen.addEventListener('pointerdown', e => { touchStartX = e.clientX; });
  coffeeScreen.addEventListener('pointerup', e => {
    const diff = e.clientX - touchStartX;
    if (Math.abs(diff) > 40) {
      if (diff < 0) currentCoffee = (currentCoffee + 1) % coffeeTypes.length;
      else currentCoffee = (currentCoffee - 1 + coffeeTypes.length) % coffeeTypes.length;
      updateCoffeeDisplay();
    }
  });

  renderCoffeeDots();

  /* ── Steam temp animation ── */
  function animateSteamTemp() {
    let temp = 22;
    const target = 89;
    const el = document.getElementById('steam-temp');
    const interval = setInterval(() => {
      temp += Math.ceil((target - temp) * 0.12);
      if (temp >= target) { temp = target; clearInterval(interval); }
      el.innerHTML = temp + '<span>°C</span>';
    }, 40);
  }

  /* ── Water temp animation ── */
  function animateWaterTemp() {
    let temp = 22;
    const target = 78;
    const el = document.getElementById('water-temp');
    const interval = setInterval(() => {
      temp += Math.ceil((target - temp) * 0.12);
      if (temp >= target) { temp = target; clearInterval(interval); }
      el.innerHTML = temp + '<span>°C</span>';
    }, 40);
  }

  /* ── Water start/stop toggle ── */
  let waterRunning = false;
  function toggleWater() {
    waterRunning = !waterRunning;
    const btn = document.getElementById('water-play-btn');
    const icon = document.getElementById('water-play-icon');
    if (waterRunning) {
      icon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
      btn.style.background = 'linear-gradient(135deg, #d45b5b, #b84040)';
      btn.style.boxShadow = '0 4px 20px rgba(212,91,91,0.3)';
    } else {
      icon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
      btn.style.background = 'linear-gradient(135deg, #5ba0d4, #4080b8)';
      btn.style.boxShadow = '0 4px 20px rgba(91,160,212,0.3)';
    }
  }
</script>

</body>
</html>
